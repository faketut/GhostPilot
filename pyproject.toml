[project]
name = "ghostpilot"
version = "0.4.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Stick to real errors only; the legacy codebase predates I/UP conventions.
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E401", "W291", "W293", "F541"]
