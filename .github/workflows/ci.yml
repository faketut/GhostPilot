name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyAudioWPatch is Windows-only; install bare PyAudio elsewhere.
          if [ "$RUNNER_OS" != "Windows" ]; then
            pip install pyaudio || true
          fi
          # Skip PyAudioWPatch on non-Windows to keep CI green.
          grep -v '^pyaudiowpatch' requirements.txt > _req.txt
          pip install -r _req.txt
          pip install pytest ruff
        shell: bash

      - name: Lint (ruff)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run tests
        run: pytest -q
